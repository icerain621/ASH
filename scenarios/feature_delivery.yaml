version: "ash.rules/v0.1"

scenario:
  name: "feature_delivery"
  scenarioVersion: "1.0.0"
  description: "Feature 从需求到交付的薄模板链（v7 P3）"
  policyProfile: "default"
  skills:
    - ash-test-discipline
    - ash-diff-review
  checkpoint:
    strategy: "per_step"
    retain: 50

  roles:
    Planner:  { maxParallel: 1 }
    Coder:    { maxParallel: 1 }
    Reviewer: { maxParallel: 1 }

  inputs:
    required: [issueOrSpec, repoRoot]
    optional: [constraints, targetBranch]

  artifacts:
    required:
      - { type: "diff" }
      - { type: "test_report" }
      - { type: "release_notes" }
      - { type: "rollback_plan" }

  gates:
    - id: "gate.repo.clean"
      when: "before.step.code.implement"
      blocking: true
      check:
        tool: "git.status"
        expect: { clean: true }
      onFail:
        message: "工作区不干净，请提交或 stash"
        remediation:
          - { tool: "git.diff" }

  steps:
    - id: "plan.clarify"
      role: "Planner"
      kind: "agent"
      timeoutMs: 120000
      agent:
        templateId: "tpl.plan-solve"
        prompt: "Clarify the issue and produce a short executable plan."
      rag:
        sources: ["code", "docs", "memory:L1"]
        requireCitations: true

    - id: "code.implement"
      role: "Coder"
      kind: "agent"
      timeoutMs: 120000
      agent:
        templateId: "tpl.react"
        prompt: "Implement the requested feature or fix with the smallest safe change. Run relevant tests and leave the working tree with the intended diff."

    - id: "review.quality"
      role: "Reviewer"
      kind: "review"
      timeoutMs: 60000
      agent:
        templateId: "tpl.reviewer"
        prompt: "Review the change for correctness, risk, and missing tests."

hooks:
  - id: "hook.pre_tool"
    on: "tool.called"
    policy: "enforce"
    rules:
      - match: { tool: "shell.exec", risk: "danger" }
        action: { deny: true, reason: "危险命令需人工批准或提升策略档" }
