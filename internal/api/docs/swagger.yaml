        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_api.APIErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.APIErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.APIErrorResponse'
      summary: Approve an approval request
      tags:
      - approvals
  /api/v1/approvals/{approvalId}/reject:
