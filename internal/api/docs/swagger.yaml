    name: Proprietary
  title: ASH Worker API
  version: "0.1"
paths:
  /api/v1/approvals:
    get:
      parameters:
      - default: pending
        description: approval status
        in: query
        name: status
        type: string
      - default: 50
        description: max items
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.ApprovalRequestListResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_api.APIErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.APIErrorResponse'
      summary: List approval requests
      tags:
      - approvals
  /api/v1/approvals/{approvalId}/approve:
    post:
      consumes:
      - application/json
      parameters:
      - description: approval id
        in: path
        name: approvalId
        required: true
        type: string
      - description: approval request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_ash-repwiki_ash_internal_runs.ApproveRequest'
      produces:
      - application/json
      responses:
