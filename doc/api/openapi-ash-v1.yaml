      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecideCIDiagnosisRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiagnosisResponse" }
