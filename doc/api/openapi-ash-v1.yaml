openapi: 3.0.3
info:
  title: ASH API
  version: 1.0.0
  description: |
    ASH AI Platform MVP APIs (product contract draft).
    Implementation source of truth is swag output in internal/api/docs (served at /openapi.json).
    Alignment policy: doc/api/openapi-alignment.md — only /api/v1/* paths here are enforced by make openapi-check.
x-ash-contract:
  role: product-draft
  implementationSource: internal/api/docs/swagger.yaml
  enforcedPathPrefix: /api/v1/
  legacyPlannedPathPrefix: /v1/
servers:
  - url: https://api.ash.local
tags:
  - name: Tasks
  - name: AgentRuns
  - name: Memories
  - name: Runs
  - name: Scenarios
  - name: Memory
  - name: Auth
  - name: Orgs
  - name: Spaces
  - name: Approvals
  - name: Audit
  - name: Compliance
  - name: Doctor
  - name: Improve
  - name: Mcp
  - name: ModelRouter
  - name: Permissions
  - name: Plugins
  - name: Rag
  - name: Scale
  - name: Secrets
  - name: Storage
  - name: Repo
  - name: CI
  - name: Feedback
  - name: Metrics
  - name: Observability
  - name: Releases
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiResponse:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string, example: ok }
        data: { type: object, nullable: true }
    ApiError:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: INVALID_REQUEST }
        message: { type: string, example: validation failed }
    ApiErrorResponse:
      type: object
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/ApiError" }
    CreateTaskRequest:
      type: object
      required: [title, goal, projectId, mode]
      properties:
        title: { type: string, maxLength: 256 }
        goal: { type: string }
        projectId: { type: string, maxLength: 64 }
        spaceId: { type: integer, format: int64, nullable: true }
        priority: { type: string, enum: [low, medium, high], default: medium }
        mode: { type: string, enum: [assist, auto] }
    CreateTaskResponseData:
      type: object
      properties:
        taskId: { type: integer, format: int64 }
        status: { type: string, example: CREATED }
        createdAt: { type: string, format: date-time }
    StartTaskRequest:
      type: object
      properties:
        riskLevel: { type: string, enum: [low, medium, high], default: low }
        toolPolicy:
          type: object
          properties:
            allow:
              type: array
              items: { type: string }
            requireApprovalFor:
              type: array
              items: { type: string }
    StartTaskResponseData:
      type: object
      properties:
        runId: { type: integer, format: int64 }
        state: { type: string, example: PLANNING }
    AgentRun:
      type: object
      properties:
        runId: { type: integer, format: int64 }
        taskId: { type: integer, format: int64 }
        state:
          type: string
          enum: [PLANNING, EXECUTING, REVIEWING, DONE, BLOCKED, NEED_HUMAN, ERROR]
        plan:
          type: object
          nullable: true
        riskFlags:
          type: array
          items: { type: string }
    CreateMemoryRequest:
      type: object
      required: [scope, content, source]
      properties:
        scope: { type: string, enum: [user, project, session] }
        ownerUserId: { type: integer, format: int64, nullable: true }
        projectId: { type: string, nullable: true }
        sessionId: { type: string, nullable: true }
        content: { type: string }
        tags:
          type: array
          items: { type: string }
        source: { type: string, enum: [manual, agent, feedback, import] }
        confidence: { type: number, format: float, minimum: 0, maximum: 1, default: 0.7 }
    MemorySearchRequest:
      type: object
      required: [query, topK]
      properties:
        query: { type: string }
        scope:
          type: array
          items: { type: string, enum: [user, project, session] }
        projectId: { type: string, nullable: true }
        topK: { type: integer, minimum: 1, maximum: 50, default: 5 }
    DiagnoseCiFailureRequest:
      type: object
      required: [pipelineId, repoRef]
      properties:
        pipelineId: { type: string }
        repoRef: { type: string }
        logRange:
          type: object
          properties:
            from: { type: integer }
            to: { type: integer }
    SubmitFeedbackRequest:
      type: object
      required: [targetType, targetId, rating, category]
      properties:
        targetType: { type: string, enum: [copilot, agent_run, memory_hit] }
        targetId: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        category: { type: string, enum: [accuracy, timeliness, executability, other] }
        comment: { type: string, maxLength: 1024 }
security:
  - bearerAuth: []
paths:
  /v1/tasks:
    post:
      tags: [Tasks]
      summary: Create task
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTaskRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/CreateTaskResponseData" }
  /v1/tasks/{taskId}:
    get:
      tags: [Tasks]
      summary: Get task detail
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
  /v1/tasks/{taskId}/start:
    post:
      tags: [Tasks]
      summary: Start task
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartTaskRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/StartTaskResponseData" }
  /v1/tasks/{taskId}/cancel:
    post:
      tags: [Tasks]
      summary: Cancel task
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
  /v1/agent-runs/{runId}:
    get:
      tags: [AgentRuns]
      summary: Get agent run detail
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AgentRun" }
  /v1/runs/{runId}/stream:
    get:
      tags: [AgentRuns]
      summary: Stream run logs (SSE)
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: text/event-stream
          content:
            text/event-stream:
              schema:
                type: string
  /v1/memories:
    post:
      tags: [Memories]
      summary: Create memory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMemoryRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
  /v1/memories/search:
    post:
      tags: [Memories]
      summary: Search memories
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemorySearchRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
  /api/v1/repo/connections:
    post:
      tags: [Repo]
      summary: Create GitHub repo connection
      description: Plaintext tokens are rejected; use secretId to reference a stored secret.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [owner, repo, secretId]
              properties:
                provider: { type: string, enum: [github], default: github }
                owner: { type: string }
                repo: { type: string }
                defaultBranch: { type: string, default: main }
                secretId: { type: string }
                spaceId: { type: string }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
    get:
      tags: [Repo]
      summary: List repo connections
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
  /api/v1/repo/connections/{connectionId}/test:
    post:
      tags: [Repo]
      summary: Test repo connection without exposing its secret
      parameters:
        - in: path
          name: connectionId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
  /api/v1/ci/runs:
    get:
      tags: [CI]
      summary: List CI workflow run snapshots
      parameters:
        - in: query
          name: connectionId
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
        - in: query
          name: sync
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
  /api/v1/ci/failures/diagnose:
    post:
      tags: [CI]
      summary: Diagnose CI failure
      description: Deterministic v1 diagnosis with rootCause, fixSuggestions, evidenceRefs and confidence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                connectionId: { type: string }
                runId: { type: string }
                jobId: { type: string }
                logText: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
  /v1/spaces:
    post:
      tags: [Spaces]
      summary: Create space
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 128 }
                description: { type: string, maxLength: 512 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
  /v1/spaces/{spaceId}/members:
    post:
      tags: [Spaces]
      summary: Add space member
      parameters:
        - in: path
          name: spaceId
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, role]
              properties:
                userId: { type: integer, format: int64 }
                role: { type: string, enum: [owner, developer, viewer] }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
  /v1/feedback:
    post:
      tags: [Feedback]
      summary: Submit feedback
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitFeedbackRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
  /api/v1/metrics/prometheus:
    get:
      tags: [Metrics]
      summary: Get tenant-scoped Prometheus metrics text
      parameters:
        - in: query
          name: spaceId
          schema: { type: string }
      responses:
        "200":
          description: Prometheus text/plain
          content:
            text/plain:
              schema: { type: string }
        "403":
          description: forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
  /api/v1/metrics/overview:
    get:
      tags: [Metrics]
      summary: Get KPI dashboard metrics
      parameters:
        - in: query
          name: projectId
          schema: { type: string }
        - in: query
          name: spaceId
          schema: { type: string }
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
        - in: query
          name: period
          schema: { type: string, enum: [day, week], default: day }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
  /api/v1/ci/jobs:
    get:
      tags: [CI]
      summary: List CI workflow jobs
      parameters:
        - in: query
          name: runId
          schema: { type: string }
        - in: query
          name: sync
          schema: { type: boolean }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
  /api/v1/ci/diagnoses:
    get:
      tags: [CI]
      summary: List CI diagnoses
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
  /api/v1/ci/diagnoses/{diagnosisId}/adopt:
    post:
      tags: [CI]
      summary: Adopt CI diagnosis
      parameters:
        - in: path
          name: diagnosisId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
  /api/v1/ci/diagnoses/{diagnosisId}/dismiss:
    post:
      tags: [CI]
      summary: Dismiss CI diagnosis
      parameters:
        - in: path
          name: diagnosisId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
  /api/v1/feedback/{feedbackId}:
    patch:
      tags: [Feedback]
      summary: Update feedback handling state
      parameters:
        - in: path
          name: feedbackId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
  /api/v1/observability/alerts:
    get:
      tags: [Observability]
      summary: List alert events
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
  /api/v1/observability/alert-rules:
    get:
      tags: [Observability]
      summary: List alert rules
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
    put:
      tags: [Observability]
      summary: Update alert rules
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
  /api/v1/observability/alerts/evaluate:
    post:
      tags: [Observability]
      summary: Evaluate alert rules
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
  /api/v1/observability/trace/{traceId}:
    get:
      tags: [Observability]
      summary: Get trace-linked records
      parameters:
        - in: path
          name: traceId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
  /api/v1/releases:
    get:
      tags: [Releases]
      summary: List releases
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
    post:
      tags: [Releases]
      summary: Create release
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
  /api/v1/releases/{releaseId}/checklist:
    get:
      tags: [Releases]
      summary: Get release checklist
      parameters:
        - in: path
          name: releaseId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
    patch:
      tags: [Releases]
      summary: Update release checklist
      parameters:
        - in: path
          name: releaseId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
  /api/v1/releases/{releaseId}/gate:
    post:
      tags: [Releases]
      summary: Evaluate release gates
      parameters:
        - in: path
          name: releaseId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
  /api/v1/releases/{releaseId}/rollback-drills:
    post:
      tags: [Releases]
      summary: Record rollback drill
      parameters:
        - in: path
          name: releaseId
          required: true
          schema: { type: string }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
  /api/v1/approvals:
    get:
      tags: [Approvals]
      summary: List approval requests
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }

  /api/v1/approvals/{approvalId}/approve:
    post:
      tags: [Approvals]
      summary: Approve an approval request
      parameters:
        - in: path
          name: approvalId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }

  /api/v1/approvals/{approvalId}/reject:
    post:
      tags: [Approvals]
      summary: Reject an approval request and cancel the run
      parameters:
        - in: path
          name: approvalId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }

  /api/v1/audit/exports:
    get:
      tags: [Audit]
      summary: List audit exports
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }

  /api/v1/audit/exports/{exportId}/access:
    get:
      tags: [Audit]
      summary: Get signed audit export access
      parameters:
        - in: path
          name: exportId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }

  /api/v1/audit/logs:
    get:
      tags: [Audit]
      summary: List audit logs
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }

  /api/v1/audit/policy:
    get:
      tags: [Audit]
      summary: Get audit retention policy
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
    put:
      tags: [Audit]
      summary: Update audit retention policy
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }

  /api/v1/audit/retention/apply:
    post:
      tags: [Audit]
      summary: Apply audit retention policy
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login with local credentials
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated identity
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }

  /api/v1/auth/password:
    post:
      tags: [Auth]
      summary: "Change current user's password"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }

  /api/v1/compliance/export:
    post:
      tags: [Compliance]
      summary: Export audit bundle with doctor report and secret scan summary
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }

  /api/v1/compliance/secret-scan:
    get:
      tags: [Compliance]
      summary: Scan audit logs and run events for secret patterns
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }

  /api/v1/doctor/reports/{reportId}:
    get:
      tags: [Doctor]
      summary: Get doctor report
      parameters:
        - in: path
          name: reportId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }

  /api/v1/doctor/run:
    post:
      tags: [Doctor]
      summary: Run validation suite
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }

  /api/v1/feedback:
    get:
      tags: [Feedback]
      summary: List feedback
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
    post:
      tags: [Feedback]
      summary: Create feedback
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }

  /api/v1/improve/proposals:
    get:
      tags: [Improve]
      summary: List improvement proposals
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
    post:
      tags: [Improve]
      summary: Create self-improvement proposal
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }

  /api/v1/improve/proposals/{proposalId}:
    get:
      tags: [Improve]
      summary: Get improvement proposal
      parameters:
        - in: path
          name: proposalId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }

  /api/v1/improve/proposals/{proposalId}/canary:
    post:
