security:
  - bearerAuth: []
paths:
  /v1/tasks:
    post:
      tags: [Tasks]
      summary: Create task
      description: M0 legacy planned path. Implementation uses /api/v1/runs and task orchestration APIs.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTaskRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateTaskResponseData" }
  /v1/tasks/{taskId}:
    get:
      tags: [Tasks]
      summary: Get task detail
      description: M0 legacy planned path.
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskDetailResponse" }
  /v1/tasks/{taskId}/start:
    post:
      tags: [Tasks]
      summary: Start task
      description: M0 legacy planned path.
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartTaskRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StartTaskResponseData" }
  /v1/tasks/{taskId}/cancel:
    post:
      tags: [Tasks]
      summary: Cancel task
      description: M0 legacy planned path.
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskCancelResponse" }
  /v1/agent-runs/{runId}:
    get:
      tags: [AgentRuns]
      summary: Get agent run detail
      description: M0 legacy planned path. Use GET /api/v1/runs/{runId} in implementation.
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRun" }
  /v1/runs/{runId}/stream:
    get:
      tags: [AgentRuns]
      summary: Stream run logs (SSE)
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: text/event-stream
          content:
            text/event-stream:
              schema:
                type: string
  /v1/memories:
    post:
      tags: [Memories]
      summary: Create memory
      description: M0 legacy planned path. Use POST /api/v1/memory/candidates in implementation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMemoryRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegacyMemoryCreateResponse" }
  /v1/memories/search:
    post:
      tags: [Memories]
      summary: Search memories
      description: M0 legacy planned path. Use POST /api/v1/memory/query in implementation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemorySearchRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemoryQueryResponse" }
  /api/v1/repo/connections:
    post:
      tags: [Repo]
      summary: Create GitHub repo connection
      description: Plaintext tokens are rejected; use secretId to reference a stored secret.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRepoConnectionRequest" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepoConnectionItem" }
    get:
      tags: [Repo]
      summary: List repo connections
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepoConnectionListResponse" }
  /api/v1/ci/runs:
    get:
      tags: [CI]
      summary: List CI workflow run snapshots
      parameters:
        - in: query
          name: connectionId
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
        - in: query
          name: sync
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CIRunListResponse" }
  /api/v1/ci/failures/diagnose:
    post:
      tags: [CI]
      summary: Diagnose CI failure
      description: Deterministic v1 diagnosis with rootCause, fixSuggestions, evidenceRefs and confidence.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiagnoseCIFailureRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiagnosisResponse" }
