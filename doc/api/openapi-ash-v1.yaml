      parameters:
        - in: path
          name: spaceId
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LegacySpaceMemberRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberItem" }
  /v1/feedback:
    post:
      tags: [Feedback]
      summary: Submit feedback
      description: M0 legacy planned path. Use POST /api/v1/feedback in implementation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitFeedbackRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackItem" }
  /api/v1/metrics/prometheus:
    get:
      tags: [Metrics]
      summary: Get tenant-scoped Prometheus metrics text
      parameters:
        - in: query
          name: spaceId
          schema: { type: string }
      responses:
        "200":
          description: Prometheus text/plain
          content:
            text/plain:
              schema: { type: string }
        "403":
          description: forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
  /api/v1/metrics/overview:
    get:
      tags: [Metrics]
      summary: Get KPI dashboard metrics
      parameters:
        - in: query
          name: projectId
          schema: { type: string }
        - in: query
          name: spaceId
          schema: { type: string }
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
        - in: query
          name: period
          schema: { type: string, enum: [day, week], default: day }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricsOverviewResponse" }
        "403":
          description: forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
  /api/v1/ci/jobs:
    get:
      tags: [CI]
      summary: List CI workflow jobs
      parameters:
        - in: query
          name: runId
          schema: { type: string }
