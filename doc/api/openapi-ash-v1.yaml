      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LegacySpaceCreateRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpaceItem" }
