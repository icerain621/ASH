openapi: 3.0.3
info:
  title: ASH API
  version: 1.0.0
  description: |
    ASH AI Platform MVP APIs (product contract draft).
    Implementation source of truth is swag output in internal/api/docs (served at /openapi.json).
    Alignment policy: doc/api/openapi-alignment.md — only /api/v1/* paths here are enforced by make openapi-check.
x-ash-contract:
  role: product-draft
  implementationSource: internal/api/docs/swagger.yaml
  enforcedPathPrefix: /api/v1/
  legacyPlannedPathPrefix: /v1/
servers:
  - url: https://api.ash.local
tags:
  - name: Tasks
  - name: AgentRuns
  - name: Memories
  - name: Runs
  - name: Scenarios
  - name: Memory
  - name: Auth
  - name: Orgs
  - name: Spaces
  - name: Approvals
  - name: Audit
  - name: Compliance
  - name: Doctor
  - name: Improve
  - name: Mcp
  - name: ModelRouter
  - name: Permissions
  - name: Plugins
  - name: Rag
  - name: Scale
  - name: Secrets
  - name: Storage
  - name: Repo
  - name: CI
  - name: Feedback
  - name: Metrics
  - name: Observability
  - name: Releases
  - name: Health
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiResponse:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string, example: ok }
        data: { type: object, nullable: true }
    ApiError:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: INVALID_REQUEST }
        message: { type: string, example: validation failed }
    ApiErrorResponse:
      type: object
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/ApiError" }
    CreateTaskRequest:
      type: object
      required: [title, goal, projectId, mode]
      properties:
        title: { type: string, maxLength: 256 }
        goal: { type: string }
        projectId: { type: string, maxLength: 64 }
        spaceId: { type: integer, format: int64, nullable: true }
        priority: { type: string, enum: [low, medium, high], default: medium }
        mode: { type: string, enum: [assist, auto] }
    CreateTaskResponseData:
      type: object
      properties:
        taskId: { type: integer, format: int64 }
        status: { type: string, example: CREATED }
        createdAt: { type: string, format: date-time }
    StartTaskRequest:
      type: object
      properties:
        riskLevel: { type: string, enum: [low, medium, high], default: low }
        toolPolicy:
          type: object
          properties:
            allow:
              type: array
              items: { type: string }
            requireApprovalFor:
              type: array
              items: { type: string }
    StartTaskResponseData:
      type: object
      properties:
        runId: { type: integer, format: int64 }
        state: { type: string, example: PLANNING }
    AgentRun:
      type: object
      properties:
        runId: { type: integer, format: int64 }
        taskId: { type: integer, format: int64 }
        state:
          type: string
          enum: [PLANNING, EXECUTING, REVIEWING, DONE, BLOCKED, NEED_HUMAN, ERROR]
        plan:
          type: object
          nullable: true
        riskFlags:
          type: array
          items: { type: string }
    CreateMemoryRequest:
      type: object
      required: [scope, content, source]
      properties:
        scope: { type: string, enum: [user, project, session] }
        ownerUserId: { type: integer, format: int64, nullable: true }
        projectId: { type: string, nullable: true }
        sessionId: { type: string, nullable: true }
        content: { type: string }
        tags:
          type: array
          items: { type: string }
        source: { type: string, enum: [manual, agent, feedback, import] }
        confidence: { type: number, format: float, minimum: 0, maximum: 1, default: 0.7 }
    MemorySearchRequest:
      type: object
      required: [query, topK]
      properties:
        query: { type: string }
        scope:
          type: array
          items: { type: string, enum: [user, project, session] }
        projectId: { type: string, nullable: true }
        topK: { type: integer, minimum: 1, maximum: 50, default: 5 }
    DiagnoseCiFailureRequest:
      type: object
      required: [pipelineId, repoRef]
      properties:
        pipelineId: { type: string }
        repoRef: { type: string }
        logRange:
          type: object
          properties:
            from: { type: integer }
            to: { type: integer }
    SubmitFeedbackRequest:
      type: object
      required: [targetType, targetId, rating, category]
      properties:
        targetType: { type: string, enum: [copilot, agent_run, memory_hit] }
        targetId: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        category: { type: string, enum: [accuracy, timeliness, executability, other] }
        comment: { type: string, maxLength: 1024 }
    ScaleReadinessResponse:
      type: object
      description: TR3/M3 scale readiness snapshot for the active space (GET /api/v1/scale/readiness).
      required: [spaceId, memorySchemaVersion, memoryApprovedCount, ragDocumentCount, ragChunkCount, modelUsageRows, modelCostMicrosTotal, qualityMetricRows, auditLogRows, databaseDialect, postgresConfigured, migrationReady, migrationTableCount, dualWriteEnabled, dualWriteRuntime, postgresRLSEnabled, postgresRLSForce]
      properties:
        spaceId:
          type: string
          description: Active tenant space id.
        memorySchemaVersion:
          type: integer
          description: Current memory record schema version.
        memoryApprovedCount:
          type: integer
          format: int64
          description: Approved memory records in this space.
        runRunningCount:
          type: integer
          format: int64
          description: Runs currently in running status (space-scoped backlog signal).
        runWaitingApprovalCount:
          type: integer
          format: int64
          description: Runs waiting on human/citation/tool approval gates.
        runInflightCount:
          type: integer
          format: int64
          description: runRunningCount + runWaitingApprovalCount.
        ragDocumentCount:
          type: integer
          format: int64
        ragChunkCount:
          type: integer
          format: int64
        modelUsageRows:
          type: integer
          format: int64
          description: Deployment-global model usage rows (not space-filtered).
        modelCostMicrosTotal:
          type: integer
          format: int64
          description: Sum of model cost in micros (deployment-global).
        qualityMetricRows:
          type: integer
          format: int64
        auditLogRows:
          type: integer
          format: int64
        databaseDialect:
          type: string
          enum: [sqlite, postgres]
          description: Runtime database dialect.
        postgresConfigured:
          type: boolean
          description: ASH_DATABASE_URL points at Postgres.
        migrationReady:
          type: boolean
          description: Migration catalog tables exist and profile is consistent.
        sqlitePath:
          type: string
          description: Local SQLite path when dialect is sqlite.
        migrationTableCount:
          type: integer
          description: Tables in sqlite→postgres migration catalog.
        dualWriteEnabled:
          type: boolean
        dualWriteRuntime:
          type: boolean
        dualWriteSource:
          type: string
          description: Dual-write config source (file/env).
        lastMigrationSyncAtMs:
          type: integer
          format: int64
          nullable: true
        lastMigrationSyncError:
          type: string
        lastMigrationSyncErrorAtMs:
          type: integer
          format: int64
          nullable: true
        postgresRLSEnabled:
          type: boolean
          description: ASH_POSTGRES_RLS=1.
        postgresRLSForce:
          type: boolean
          description: ASH_POSTGRES_RLS_FORCE=1.
        postgresRLSPolicyCount:
          type: integer
          format: int64
          description: Installed ash_space_* policies when Postgres RLS is active.
        postgresRLSPolicyExpected:
          type: integer
          format: int64
          description: Expected ash_space_* policy count from store.PostgresRLSExpectedPolicyCount() (rev 000013–000020).
        rlsCatalogSummary:
          type: string
          description: Compact RLS classification summary when Postgres RLS is active.
        postgresAppUrlConfigured:
          type: boolean
          description: ASH_DATABASE_APP_URL is set (worker app role).
        workerConnectionRole:
          type: string
          description: Effective worker DB role hint (sqlite/postgres/ash_app).
        runtimeDsnHint:
          type: string
          description: Redacted runtime DSN hint.
        dualWriteShadowUrlHint:
          type: string
          description: Redacted shadow Postgres URL when dual-write is configured.
        schemaMode:
          type: string
          enum: [automigrate, sql]
          description: ASH_SCHEMA_MODE value.
        sqlMigrationsEnabled:
          type: boolean
        autoMigrateEnabled:
          type: boolean
        sqlMigrationVersion:
          type: integer
          description: Applied golang-migrate version on Postgres.
        sqlMigrationExpected:
          type: integer
          description: Expected golang-migrate version embedded in the binary.
        readinessWarnings:
          type: array
          items: { type: string }
          description: Config conflicts (e.g. ASH_SCHEMA_MODE=sql with dual-write).
        memoryCatalogVersion:
          type: integer
        memoryPendingMigrationRecords:
          type: integer
          format: int64
        ragFtsAvailable:
          type: boolean
        ragFtsEngine:
          type: string
          description: FTS engine id (sqlite-fts5, postgres-tsvector, etc.).
        ragDefaultRetrievalMode:
          type: string
          enum: [fts, chunk, empty]
        ragFallbackQueryCount:
          type: integer
          format: int64
          description: RAG queries that fell back from FTS to chunk retrieval.
        otelEnabled:
          type: boolean
          description: Worker OTel export enabled.
        alertsEvalInterval:
          type: string
          description: ASH_ALERTS_EVAL_INTERVAL duration (e.g. 5m0s).
        memoryTTLSweepInterval:
          type: string
          description: ASH_MEMORY_TTL_SWEEP_INTERVAL duration (e.g. 24h0m0s).
        retentionEventsDays:
          type: integer
          description: ASH_RETENTION_EVENTS_DAYS default (appendix J).
        retentionAuditDays:
          type: integer
          description: ASH_RETENTION_AUDIT_DAYS default (appendix J).
        retentionArtifactsDays:
          type: integer
          description: ASH_RETENTION_ARTIFACTS_DAYS default (appendix J).
        retentionArtifactsMaxRuns:
          type: integer
          description: ASH_RETENTION_ARTIFACTS_MAX_RUNS default (appendix J).
        memoryTTLReviewDueCount:
          type: integer
          format: int64
          description: Approved records in TTL review window for this space.
        memoryTTLExpiredPendingCount:
          type: integer
          format: int64
          description: Approved records past TTL awaiting sweep.
        memoryTTLReviewLeadDays:
          type: integer
          description: Days before expiry when records enter review queue.
        metricsEventReplayEnabled:
          type: boolean
          description: ASH_METRICS_EVENT_REPLAY=1 appends derive replay segment to Prometheus text.
    ScenarioRef:
      type: object
      required: [name, scenarioVersion]
      properties:
        name: { type: string }
        scenarioVersion: { type: string }
    ProvenanceLink:
      type: object
      required: [kind, ref]
      properties:
        kind:
          type: string
          description: Link kind (run, trace, events, artifacts, toolCalls).
        ref: { type: string }
    ProvenanceResponse:
      type: object
      description: TR3-04 delivery provenance chain for a run.
      required: [runId, traceId, scenario, status, toolCalls, agentTasks, artifacts, events, modelUsage, links]
      properties:
        runId: { type: string }
        traceId: { type: string }
        scenario: { $ref: "#/components/schemas/ScenarioRef" }
        status: { type: string }
        toolCalls: { type: integer }
        agentTasks: { type: integer }
        artifacts: { type: integer }
        events: { type: integer }
        modelUsage: { type: integer }
        links:
          type: array
          items: { $ref: "#/components/schemas/ProvenanceLink" }
    LeakFinding:
      type: object
      properties:
        source: { type: string, description: audit_log or run_event }
        ref: { type: string }
        pattern: { type: string }
        snippet: { type: string }
    SecretScanResponse:
      type: object
      description: TR2-05 secret pattern scan over audit logs and run events.
      required: [spaceId, scanned, leakCount, redactEnabled, findings]
      properties:
        spaceId: { type: string }
        scanned: { type: integer }
        leakCount: { type: integer }
        redactEnabled: { type: boolean }
        findings:
          type: array
          items: { $ref: "#/components/schemas/LeakFinding" }
    DoctorEvidence:
      type: object
      properties:
        kind: { type: string }
        ref: { type: string }
        digest: { type: string }
    DoctorCaseResult:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [pass, fail] }
        runId: { type: string }
        message: { type: string }
        evidence:
          type: array
          items: { $ref: "#/components/schemas/DoctorEvidence" }
    DoctorReportSummary:
      type: object
      properties:
        pass: { type: integer }
        fail: { type: integer }
    DoctorReportResponse:
      type: object
      properties:
        suite: { type: string }
        startedAt: { type: integer, format: int64 }
        finishedAt: { type: integer, format: int64 }
        results:
          type: array
          items: { $ref: "#/components/schemas/DoctorCaseResult" }
        summary: { $ref: "#/components/schemas/DoctorReportSummary" }
    ComplianceExportRequest:
      type: object
      properties:
        suite: { type: string, example: TR2 }
        reportId: { type: string }
    ComplianceExportResponse:
      type: object
      required: [exportId, suite]
      properties:
        exportId: { type: string }
        reportId: { type: string }
        suite: { type: string }
        report:
          allOf:
            - { $ref: "#/components/schemas/DoctorReportResponse" }
          nullable: true
    PluginRegistryItem:
      type: object
      description: plugin_registry row (list, health summary, and registration responses).
      properties:
        id: { type: string }
        spaceID: { type: string }
        name: { type: string }
        version: { type: string }
        protocol: { type: string }
        abi: { type: string }
        endpoint: { type: string }
        capabilities: { type: string }
        status: { type: string }
        compatible: { type: boolean }
        dropCount: { type: integer }
        exportErrors: { type: integer }
        lastError: { type: string }
        lastExportAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PluginHealthSummary:
      type: object
      description: Plugin export health aggregate for the active space.
      required: [spaceId, pluginCount, exportErrorsTotal, dropCountTotal, staleExportCount, items]
      properties:
        spaceId: { type: string }
        pluginCount: { type: integer }
        exportErrorsTotal: { type: integer, format: int64 }
        dropCountTotal: { type: integer, format: int64 }
        staleExportCount: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/PluginRegistryItem" }
    RAGProfileResponse:
      type: object
      description: Tenant-scoped RAG retrieval profile (GET /api/v1/rag/profile).
      required: [spaceId, ftsAvailable, defaultRetrievalMode, databaseDialect, documentCount, chunkCount, fallbackQueryCount]
      properties:
        spaceId: { type: string }
        ftsAvailable: { type: boolean }
        ftsEngine: { type: string }
        defaultRetrievalMode: { type: string, enum: [fts, chunk, empty] }
        databaseDialect: { type: string }
        documentCount: { type: integer, format: int64 }
        chunkCount: { type: integer, format: int64 }
        fallbackQueryCount: { type: integer, format: int64 }
    OtelStatusResponse:
      type: object
      description: OTel trace export runtime status.
      properties:
        enabled: { type: boolean }
        endpoint: { type: string }
        insecure: { type: boolean }
        serviceName: { type: string }
    HealthResponse:
      type: object
      description: Liveness/readiness probe payload (/healthz, /readyz).
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, ready, not_ready]
        dialect: { type: string, example: postgres }
        error: { type: string }
        schemaMode: { type: string, enum: [automigrate, sql] }
        sqlMigrationVersion: { type: integer }
        sqlMigrationExpected: { type: integer }
        postgresRLSEnabled: { type: boolean }
        postgresRLSPolicyCount: { type: integer, format: int64 }
        postgresRLSPolicyExpected: { type: integer, format: int64 }
        rlsCatalogSummary: { type: string }
        readinessWarnings:
          type: array
          items: { type: string }
        liveGateHints:
          type: array
          items: { type: string }
          description: Enabled ASH_* live gates (M3-04..08, CI fixture); no secret values.
        otelEnabled: { type: boolean }
        alertsEvalInterval: { type: string, example: 5m0s }
        memoryTTLSweepInterval: { type: string, example: 24h0m0s }
        metricsEventReplayEnabled: { type: boolean }
        retentionEventsDays: { type: integer, example: 90 }
        retentionAuditDays: { type: integer, example: 365 }
        retentionArtifactsDays: { type: integer, example: 30 }
        retentionArtifactsMaxRuns: { type: integer, example: 200 }
    DataPolicySnapshot:
      type: object
      properties:
        eventsDays: { type: integer }
        auditDays: { type: integer }
        artifactsDays: { type: integer }
        artifactsMaxRuns: { type: integer }
        memoryTtlL1Days: { type: integer }
        memoryTtlL2Days: { type: integer }
        memoryTtlReviewDays: { type: integer }
    DataPolicyResponse:
      type: object
      required: [policy, classification, docRef]
      properties:
        policy: { $ref: "#/components/schemas/DataPolicySnapshot" }
        classification:
          type: array
          items: { type: string }
        docRef: { type: string }
    DataRetentionApplyRequest:
      type: object
      properties:
        dryRun: { type: boolean }
    DataRetentionApplyResponse:
      type: object
      properties:
        spaceId: { type: string }
        domain: { type: string }
        retentionDays: { type: integer }
        maxRuns: { type: integer }
        cutoff: { type: string, format: date-time }
        matched: { type: integer, format: int64 }
        deleted: { type: integer, format: int64 }
        filesRemoved: { type: integer, format: int64 }
        dryRun: { type: boolean }
    RepoRef:
      type: object
      properties:
        root: { type: string }
        revision: { type: string }
        branch: { type: string }
    RunSummaryResponse:
      type: object
      description: Run list/detail summary (runs.Summary).
      required: [runId, traceId, scenario, policyProfile, status, startedAt, recovered]
      properties:
        runId: { type: string }
        traceId: { type: string }
        scenario: { $ref: "#/components/schemas/ScenarioRef" }
        policyProfile: { type: string }
        status: { type: string }
        startedAt: { type: integer, format: int64 }
        finishedAt: { type: integer, format: int64, nullable: true }
        recovered: { type: boolean }
        inputsDigest: { type: string }
        repo: { $ref: "#/components/schemas/RepoRef" }
        spaceId: { type: string }
        actorRole: { type: string }
    RunListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RunSummaryResponse" }
    RunCreateResponse:
      type: object
      required: [runId, traceId]
      properties:
        runId: { type: string }
        traceId: { type: string }
    DoctorRunRequest:
      type: object
      required: [suite]
      properties:
        suite:
          type: string
          enum: [TR0, TR1, TR2, TR3, M2, M3, ALL]
        format:
          type: string
          enum: [json, md]
    DoctorRunResponse:
      type: object
      required: [reportId]
      properties:
        reportId: { type: string }
    ArtifactEntry:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        name: { type: string }
        uri: { type: string }
        storeKey: { type: string }
        digest: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer, format: int64 }
        producer: { type: object, additionalProperties: true }
    ArtifactManifest:
      type: object
      properties:
        runId: { type: string }
        scenario: { type: object, additionalProperties: true }
        createdAt: { type: integer, format: int64 }
        artifacts:
          type: array
          items: { $ref: "#/components/schemas/ArtifactEntry" }
    ArtifactsManifestResponse:
      type: object
      description: Run artifacts manifest and flattened artifact list.
      properties:
        manifest: { $ref: "#/components/schemas/ArtifactManifest" }
        artifacts:
          type: array
          items: { $ref: "#/components/schemas/ArtifactEntry" }
    ArtifactAccessResponse:
      type: object
      properties:
        runId: { type: string }
        name: { type: string }
        uri: { type: string }
        signedUrl: { type: string }
        expiresAt: { type: integer, format: int64 }
        digest: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer, format: int64 }
    TimelineItem:
      type: object
      properties:
        seq: { type: integer, format: int64 }
        ts: { type: integer, format: int64 }
        type: { type: string }
        severity: { type: string }
        stepId: { type: string }
        status: { type: string }
        payload: { type: object, additionalProperties: true }
    TimelineAPIResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TimelineItem" }
    DatabaseProfile:
      type: object
      properties:
        dataDir: { type: string }
        dialect: { type: string }
        urlConfigured: { type: boolean }
        postgresRLSEnabled: { type: boolean }
        postgresRLSForce: { type: boolean }
        postgresRLSPolicyCount: { type: integer }
    ArtifactStoreProfile:
      type: object
      properties:
        kind: { type: string }
        uri: { type: string }
        ready: { type: boolean }
        objectStore: { type: boolean }
        supportsSignedUrl: { type: boolean }
        error: { type: string }
    StorageProfileResponse:
      type: object
      required: [artifactStore, database]
      properties:
        artifactStore: { $ref: "#/components/schemas/ArtifactStoreProfile" }
        database: { $ref: "#/components/schemas/DatabaseProfile" }
    ValidationIssue:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        path: { type: string }
    ValidationResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        issues:
          type: array
          items: { $ref: "#/components/schemas/ValidationIssue" }
    ValidateScenarioRequest:
      type: object
      required: [yaml]
      properties:
        yaml: { type: string, example: "version: ash.rules/v0.1" }
    ScenarioSummaryItem:
      type: object
      properties:
        name: { type: string }
        scenarioVersion: { type: string }
        description: { type: string }
        policyProfile: { type: string }
        stepCount: { type: integer }
        gateCount: { type: integer }
    ScenarioListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ScenarioSummaryItem" }
    ScenarioDetailResponse:
      type: object
      properties:
        version: { type: string, example: ash.rules/v0.1 }
        valid: { type: boolean }
        yaml: { type: string }
        scenario: { type: object, additionalProperties: true }
        hooks:
          type: array
          items: { type: object, additionalProperties: true }
    ToolCallItem:
      type: object
      properties:
        id: { type: string }
        runID: { type: string }
        stepID: { type: string }
        traceID: { type: string }
        tool: { type: string }
        risk: { type: string }
        status: { type: string }
        attempt: { type: integer }
        timeoutMs: { type: integer }
        durationMs: { type: integer }
        argsDigest: { type: string }
        outputJSON: { type: string }
        error: { type: string }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
    ToolCallListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ToolCallItem" }
    AgentTaskItem:
      type: object
      properties:
        id: { type: string }
        runID: { type: string }
        stepID: { type: string }
        traceID: { type: string }
        agentID: { type: string }
        actionID: { type: string }
        adapter: { type: string }
        status: { type: string }
        sessionID: { type: string }
        execGoTaskID: { type: string }
        promptDigest: { type: string }
        exitCode: { type: integer }
        durationMs: { type: integer }
        errorCode: { type: string }
        errorMessage: { type: string }
        stderrSummary: { type: string }
        stdoutSummary: { type: string }
        timeoutMs: { type: integer }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
