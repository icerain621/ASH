name: Postgres E2E

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "17 18 * * *"

jobs:
  postgres-e2e:
    name: SQLite to Postgres Migration E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Docker diagnostics
        run: |
          docker version
          docker compose version

      - name: Run Postgres E2E
        run: |
          set -euo pipefail
          make postgres-e2e 2>&1 | tee postgres-e2e.log

      - name: Upload postgres e2e log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-e2e-nightly-log
          path: postgres-e2e.log
          if-no-files-found: ignore

  postgres-rls-e2e:
    name: Postgres RLS E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Docker diagnostics
        run: |
          docker version
          docker compose version

      - name: Run Postgres RLS E2E
        run: |
          set -euo pipefail
          make postgres-up
          make postgres-rls-e2e 2>&1 | tee postgres-rls-e2e.log

      - name: Upload postgres RLS log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-rls-nightly-log
          path: postgres-rls-e2e.log
          if-no-files-found: ignore

  postgres-sql-schema-e2e:
    name: Postgres SQL-only schema E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Docker diagnostics
        run: |
          docker version
          docker compose version

      - name: Run SQL schema E2E
        run: |
          set -euo pipefail
          make postgres-sql-schema-e2e 2>&1 | tee postgres-sql-schema-e2e.log

      - name: Upload postgres sql-schema log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-sql-schema-nightly-log
          path: postgres-sql-schema-e2e.log
          if-no-files-found: ignore
