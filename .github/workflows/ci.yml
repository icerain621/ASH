name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    name: Backend and Doctor Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go test all packages
        run: go test ./...

      - name: OpenAPI contract check
        run: make openapi-check

      - name: Make test
        run: make test

      - name: Doctor M3 static
        run: go run ./cmd/cli doctor --suite M3 --format md --agent static

      - name: Doctor ALL static
        run: go run ./cmd/cli doctor --suite ALL --format md --agent static

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Web build
        run: make web-build
