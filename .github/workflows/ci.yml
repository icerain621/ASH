name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    name: Backend and Doctor Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go test all packages
        run: |
          set -euo pipefail
          go test ./... -count=1 2>&1 | tee go-test.log

      - name: Upload go test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: go-test-log
          path: go-test.log
          if-no-files-found: ignore

      - name: OpenAPI contract check
        run: make openapi-check

      - name: Make test
        run: make test

      - name: Regression short
        run: make regression-short

      - name: Production config gate
        run: make production-config-gate

      - name: Queue gate
        run: make queue-gate

      - name: Config env gate
        run: make config-env-gate

      - name: H-09 release sampling static
        run: make release-sampling-static

      - name: KPI reconcile gate
        run: make kpi-reconcile-gate

      - name: Doctor M3 static
        run: go run ./cmd/cli doctor --suite M3 --format md --agent static

      - name: Doctor ALL static
        run: go run ./cmd/cli doctor --suite ALL --format md --agent static

  release-window-gate:
    name: Release window (fast static)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Release window gate
        run: make release-window-gate

  postgres-sql-schema-e2e:
    name: Postgres SQL schema E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Docker diagnostics
        run: |
          docker version
          docker compose version

      - name: Run SQL schema E2E
        run: |
          set -euo pipefail
          make postgres-sql-schema-e2e 2>&1 | tee postgres-sql-schema-e2e.log

      - name: Upload postgres sql-schema log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-sql-schema-e2e-log
          path: postgres-sql-schema-e2e.log
          if-no-files-found: ignore

  postgres-rls-e2e:
    name: Postgres RLS E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Docker diagnostics
        run: |
          docker version
          docker compose version

      - name: Run Postgres RLS E2E
        run: |
          set -euo pipefail
          make postgres-up
          make postgres-rls-e2e 2>&1 | tee postgres-rls-e2e.log

      - name: Upload postgres RLS log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-rls-e2e-log
          path: postgres-rls-e2e.log
          if-no-files-found: ignore

  postgres-e2e:
    name: Postgres full migrate E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Docker diagnostics
        run: |
          docker version
          docker compose version

      - name: Run full Postgres E2E
        run: |
          set -euo pipefail
          make postgres-e2e 2>&1 | tee postgres-e2e.log

      - name: Upload postgres e2e log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-e2e-log
          path: postgres-e2e.log
          if-no-files-found: ignore

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Web gate (lint + test + build)
        run: make web-gate
