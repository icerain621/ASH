name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    name: Backend and Doctor Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go test all packages
        run: go test ./...

      - name: OpenAPI contract check
        run: make openapi-check

      - name: Make test
        run: make test

      - name: Regression short
        run: make regression-short

      - name: Production config gate
        run: make production-config-gate

      - name: Queue gate
        run: make queue-gate

      - name: Config env gate
        run: make config-env-gate

      - name: H-09 release sampling static
        run: make release-sampling-static

      - name: Doctor M3 static
        run: go run ./cmd/cli doctor --suite M3 --format md --agent static

      - name: Doctor ALL static
        run: go run ./cmd/cli doctor --suite ALL --format md --agent static

  postgres-sql-schema-e2e:
    name: Postgres SQL schema E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run SQL schema E2E
        run: make postgres-sql-schema-e2e

  postgres-rls-e2e:
    name: Postgres RLS E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Postgres RLS E2E
        run: |
          make postgres-up
          make postgres-rls-e2e

  postgres-e2e:
    name: Postgres full migrate E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run full Postgres E2E
        run: make postgres-e2e

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Web gate (lint + test + build)
        run: make web-gate
