name: Live Worker Gate

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  worker-local-gate:
    name: Ephemeral Worker live smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Worker local gate
        run: make worker-local-gate

  release-window-gate:
    name: Release window (fast static)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Release window gate
        env:
          ASH_ROLLBACK_DRILL_SKIP_DOCTOR: "1"
        run: make release-window-gate

  mvp-signoff:
    name: MVP signoff (static gates)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: MVP signoff static
        env:
          ASH_RELEASE_AUDIT_SKIP_OPENAPI: "1"
          ASH_ROLLBACK_DRILL_SKIP_DOCTOR: "1"
        run: make mvp-signoff

  worker-production-gate:
    name: JWT Worker live smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Worker production gate
        run: make worker-production-gate
